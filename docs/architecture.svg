<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="275" viewBox="0 0 1000 275" role="img" aria-labelledby="title desc"><title id="title">Job lifecycle</title><desc id="desc">A lease token protects queue state. Consumers must deduplicate external effects.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#9c3b13"/></marker></defs><rect width="1000" height="275" fill="#f1f2ef"/><g font-family="Verdana, sans-serif"><text x="25" y="44" font-size="24" fill="#152f40">Job lifecycle</text><rect x="25" y="100" width="205" height="105" fill="#ffffff" stroke="#9ba8b0"/><text x="40" y="135" font-size="18" fill="#152f40">Producer</text><text x="40" y="165" font-size="13" fill="#3f4e57">Payload + idempotency key</text><path d="M234 150 h26" stroke="#9c3b13" stroke-width="2" marker-end="url(#arrow)"/><rect x="265" y="100" width="205" height="105" fill="#ffffff" stroke="#9ba8b0"/><text x="280" y="135" font-size="18" fill="#152f40">SQLite store</text><text x="280" y="165" font-size="13" fill="#3f4e57">Commit, claim, lease token</text><path d="M474 150 h26" stroke="#9c3b13" stroke-width="2" marker-end="url(#arrow)"/><rect x="505" y="100" width="205" height="105" fill="#ffffff" stroke="#9ba8b0"/><text x="520" y="135" font-size="18" fill="#152f40">Worker</text><text x="520" y="165" font-size="13" fill="#3f4e57">Perform external work</text><path d="M714 150 h26" stroke="#9c3b13" stroke-width="2" marker-end="url(#arrow)"/><rect x="745" y="100" width="205" height="105" fill="#ffffff" stroke="#9ba8b0"/><text x="760" y="135" font-size="18" fill="#152f40">Acknowledge / fail</text><text x="760" y="165" font-size="13" fill="#3f4e57">Finish, retry or dead letter</text><text x="25" y="248" font-size="13" fill="#3f4e57">A lease token protects queue state. Consumers must deduplicate external effects.</text></g></svg>
