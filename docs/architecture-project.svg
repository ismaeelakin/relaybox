<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">RelayBox queue handoff sequence</title><desc id="desc">Producer enqueue, SQLite commit, worker claim and execution, then token-checked acknowledgment. External effects may repeat.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#9c3b13"/></marker></defs>
<rect width="1100" height="520" fill="#fff"/><g font-family="Verdana, Geneva, sans-serif" fill="#252c31" color="#252c31"><rect x="0" y="0" width="12" height="505" fill="#9c3b13" stroke="none" stroke-dasharray=""/><text x="35" y="48" font-size="30" fill="#252c31" font-weight="bold" text-anchor="start">RelayBox</text><text x="35" y="78" font-size="13" fill="#9c3b13" font-weight="bold" text-anchor="start">QUEUE HANDOFF / TIME MOVES LEFT TO RIGHT</text><rect x="30" y="105" width="1040" height="82" fill="#f0f1ef" stroke="none" stroke-dasharray=""/><text x="45" y="140" font-size="14" fill="#434b50" font-weight="bold" text-anchor="start">PRODUCER</text><path d="M180 144 H1045" stroke="#aeb8b1" fill="none"/><rect x="30" y="220" width="1040" height="82" fill="#f0f1ef" stroke="none" stroke-dasharray=""/><text x="45" y="255" font-size="14" fill="#434b50" font-weight="bold" text-anchor="start">SQLITE</text><path d="M180 259 H1045" stroke="#aeb8b1" fill="none"/><rect x="30" y="335" width="1040" height="82" fill="#f0f1ef" stroke="none" stroke-dasharray=""/><text x="45" y="370" font-size="14" fill="#434b50" font-weight="bold" text-anchor="start">WORKER</text><path d="M180 374 H1045" stroke="#aeb8b1" fill="none"/><rect x="205" y="115" width="145" height="60" fill="#fff" stroke="#a2ada6" stroke-dasharray=""/><text x="215" y="139" font-size="16" fill="#252c31" font-weight="bold" text-anchor="start">Enqueue</text><text x="215" y="161" font-size="12" fill="#434b50" font-weight="normal" text-anchor="start">key + JSON</text><rect x="365" y="230" width="145" height="60" fill="#fff" stroke="#a2ada6" stroke-dasharray=""/><text x="375" y="254" font-size="16" fill="#252c31" font-weight="bold" text-anchor="start">Commit</text><text x="375" y="276" font-size="12" fill="#434b50" font-weight="normal" text-anchor="start">durable job</text><rect x="525" y="345" width="145" height="60" fill="#fff" stroke="#a2ada6" stroke-dasharray=""/><text x="535" y="369" font-size="16" fill="#252c31" font-weight="bold" text-anchor="start">Claim</text><text x="535" y="391" font-size="12" fill="#434b50" font-weight="normal" text-anchor="start">fresh token</text><rect x="685" y="345" width="145" height="60" fill="#fff" stroke="#a2ada6" stroke-dasharray=""/><text x="695" y="369" font-size="16" fill="#252c31" font-weight="bold" text-anchor="start">Execute</text><text x="695" y="391" font-size="12" fill="#434b50" font-weight="normal" text-anchor="start">external work</text><rect x="855" y="230" width="145" height="60" fill="#fff" stroke="#a2ada6" stroke-dasharray=""/><text x="865" y="254" font-size="16" fill="#252c31" font-weight="bold" text-anchor="start">Acknowledge</text><text x="865" y="276" font-size="12" fill="#434b50" font-weight="normal" text-anchor="start">active token</text><path d="M350 144 H360 V257 H365" fill="none" stroke="#9c3b13" stroke-width="2" marker-end="url(#arrow)"/><path d="M510 259 H520 V374 H525" fill="none" stroke="#9c3b13" stroke-width="2" marker-end="url(#arrow)"/><path d="M670 374 H685" fill="none" stroke="#9c3b13" stroke-width="2" marker-end="url(#arrow)"/><path d="M830 374 H845 V259 H855" fill="none" stroke="#9c3b13" stroke-width="2" marker-end="url(#arrow)"/><text x="35" y="465" font-size="16" fill="#9c3b13" font-weight="normal" text-anchor="start">If execution succeeds but acknowledgment is lost, another worker can repeat the side effect.</text><text x="35" y="490" font-size="15" fill="#434b50" font-weight="normal" text-anchor="start">Lease tokens fence queue state. Consumers must deduplicate external effects.</text></g></svg>
